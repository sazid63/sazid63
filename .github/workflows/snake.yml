name: Animated contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"   # refresh twice a day
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs from the contribution calendar
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#0969DA&color_dots=#EBEDF0,#C6DBF7,#79B4F2,#3A8AE8,#0969DA
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#58A6FF&color_dots=#161B22,#0C2D6B,#1158C7,#388BFD,#79C0FF&color_dot_border=#0D1117&color_background=#0D1117

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
