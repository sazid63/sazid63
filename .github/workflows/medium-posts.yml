name: Latest Medium posts

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pull latest Medium stories into README
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://medium.com/feed/@sajidhossain04"
          max_post_count: 5
          template: "- [$title]($url) <sub>· $date</sub>$newline"
          date_format: "mmm d, yyyy"
          commit_message: "Update latest Medium posts"
