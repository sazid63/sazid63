<rect class="frame" x="1" y="1" width="858" height="328" rx="14" fill="none" stroke="url(#fg)" stroke-width="2"/>
<circle cx="26" cy="24" r="6" fill="#FF5F57"/><circle cx="46" cy="24" r="6" fill="#FEBC2E"/><circle cx="66" cy="24" r="6" fill="#28C840"/>
<text x="430.0" y="29" fill="#64748B" text-anchor="middle" font-size="13">sazid63@kali-desk: ~</text>
<clipPath id="c0"><rect x="28" y="56" height="24" width="0"/></clipPath><text x="32" y="74" fill="#00F5D4" clip-path="url(#c0)" font-weight="700">$ whoami</text><clipPath id="c1"><rect x="28" y="82" height="24" width="0"/></clipPath><text x="32" y="100" fill="#E2E8F0" clip-path="url(#c1)" font-weight="400">sajid hossain  //  sazid63  //  BUET, Dhaka</text><clipPath id="c2"><rect x="28" y="108" height="24" width="0"/></clipPath><text x="32" y="126" fill="#00F5D4" clip-path="url(#c2)" font-weight="700">$ cat focus.txt</text><clipPath id="c3"><rect x="28" y="134" height="24" width="0"/></clipPath><text x="32" y="152" fill="#FF2E97" clip-path="url(#c3)" font-weight="400">[+] cybersecurity   -&gt;  KaliDesk, Home SOC, OSINT pipelines</text><clipPath id="c4"><rect x="28" y="160" height="24" width="0"/></clipPath><text x="32" y="178" fill="#8B5CF6" clip-path="url(#c4)" font-weight="400">[+] ai &amp; automation -&gt;  agents, guardrails, content autopilots</text><clipPath id="c5"><rect x="28" y="186" height="24" width="0"/></clipPath><text x="32" y="204" fill="#38BDF8" clip-path="url(#c5)" font-weight="400">[+] cryptography    -&gt;  Copiale cipher, classical ciphers</text><clipPath id="c6"><rect x="28" y="212" height="24" width="0"/></clipPath><text x="32" y="230" fill="#FACC15" clip-path="url(#c6)" font-weight="400">[+] software &amp; web  -&gt;  desktop apps, CAD tools, trading bots</text><clipPath id="c7"><rect x="28" y="238" height="24" width="0"/></clipPath><text x="32" y="256" fill="#00F5D4" clip-path="url(#c7)" font-weight="700">$ ./status --now</text><clipPath id="c8"><rect x="28" y="264" height="24" width="0"/></clipPath><text x="32" y="282" fill="#E2E8F0" clip-path="url(#c8)" font-weight="400">building in public. shipping weekly. learning always.</text>
<rect class="cur" x="32" y="293" width="10" height="18" fill="#00F5D4"/>
