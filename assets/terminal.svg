<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" role="img" aria-label="Animated terminal introducing Sajid Hossain">
<style>
text{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace;font-size:15px}
@keyframes r0{0%,2.50%{width:0}5.94%,94%{width:860px}100%{width:0}}#c0 rect{animation:r0 16.0s steps(6) infinite}@keyframes r1{0%,9.69%{width:0}14.37%,94%{width:860px}100%{width:0}}#c1 rect{animation:r1 16.0s steps(21) infinite}@keyframes r2{0%,16.88%{width:0}20.31%,94%{width:860px}100%{width:0}}#c2 rect{animation:r2 16.0s steps(7) infinite}@keyframes r3{0%,24.06%{width:0}28.75%,94%{width:860px}100%{width:0}}#c3 rect{animation:r3 16.0s steps(29) infinite}@keyframes r4{0%,31.25%{width:0}35.94%,94%{width:860px}100%{width:0}}#c4 rect{animation:r4 16.0s steps(31) infinite}@keyframes r5{0%,38.44%{width:0}43.12%,94%{width:860px}100%{width:0}}#c5 rect{animation:r5 16.0s steps(28) infinite}@keyframes r6{0%,45.62%{width:0}50.31%,94%{width:860px}100%{width:0}}#c6 rect{animation:r6 16.0s steps(30) infinite}@keyframes r7{0%,52.81%{width:0}56.25%,94%{width:860px}100%{width:0}}#c7 rect{animation:r7 16.0s steps(8) infinite}@keyframes r8{0%,60.00%{width:0}64.69%,94%{width:860px}100%{width:0}}#c8 rect{animation:r8 16.0s steps(26) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.cur{animation:blink 1s steps(1) infinite}
@keyframes glow{0%,100%{stroke-opacity:.35}50%{stroke-opacity:1}}
.frame{animation:glow 4s ease-in-out infinite}
@keyframes scan{0%{transform:translateY(-40px)}100%{transform:translateY(370px)}}
.scan{animation:scan 5s linear infinite}
</style>
<defs>
<linearGradient id="fg" x1="0" x2="1"><stop offset="0" stop-color="#00F5D4"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#FF2E97"/></linearGradient>
<linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00F5D4" stop-opacity="0"/><stop offset=".5" stop-color="#00F5D4" stop-opacity=".08"/><stop offset="1" stop-color="#00F5D4" stop-opacity="0"/></linearGradient>
<clipPath id="win"><rect x="1" y="1" width="858" height="328" rx="14"/></clipPath>
</defs>
<rect x="1" y="1" width="858" height="328" rx="14" fill="#030712"/>
