<svg xmlns="http://www.w3.org/2000/svg" width="420" height="320" viewBox="-50 0 420 320" role="img" aria-label="Animated radar scanning current focus areas">
<style>
text{font-family:'JetBrains Mono',Consolas,monospace;font-size:11px;font-weight:700}
@keyframes spin{to{transform:rotate(360deg)}}
.sweep{transform-origin:160px 160px;animation:spin 4s linear infinite}
@keyframes blip{0%{opacity:.15}6%{opacity:1}60%{opacity:.5}100%{opacity:.15}}
.b{animation:blip 4s linear infinite}
@keyframes ring{0%{transform:scale(1);opacity:.9}30%{transform:scale(3.2);opacity:0}100%{opacity:0}}
.ring{animation:ring 4s ease-out infinite}
</style>
<defs>
<radialGradient id="bg"><stop offset="0" stop-color="#042F3A"/><stop offset="1" stop-color="#030712"/></radialGradient>
<linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00F5D4" stop-opacity="0"/><stop offset="1" stop-color="#00F5D4" stop-opacity=".55"/></linearGradient>
</defs>
<circle cx="160" cy="160" r="150" fill="url(#bg)" stroke="#00F5D4" stroke-opacity=".5"/>
<g fill="none" stroke="#00F5D4" stroke-opacity=".18"><circle cx="160" cy="160" r="110"/><circle cx="160" cy="160" r="70"/><circle cx="160" cy="160" r="30"/>
<line x1="10" y1="160" x2="310" y2="160"/><line x1="160" y1="10" x2="160" y2="310"/></g>
<path class="sweep" d="M160 160 L160 10 A150 150 0 0 1 266 54 Z" fill="url(#sw)"/>
<g class="b" style="animation-delay:0.00s"><circle cx="160.0" cy="90.0" r="5" fill="#FF2E97"/><circle cx="160.0" cy="90.0" r="5" fill="none" stroke="#FF2E97" class="ring" style="animation-delay:0.00s;transform-origin:160.0px 90.0px"/><text x="170.0" y="94.0" fill="#FF2E97" text-anchor="start">Home SOC</text></g><g class="b" style="animation-delay:0.67s"><circle cx="239.7" cy="114.0" r="5" fill="#00F5D4"/><circle cx="239.7" cy="114.0" r="5" fill="none" stroke="#00F5D4" class="ring" style="animation-delay:0.67s;transform-origin:239.7px 114.0px"/><text x="249.7" y="118.0" fill="#00F5D4" text-anchor="start">OSINT</text></g><g class="b" style="animation-delay:1.33s"><circle cx="258.7" cy="217.0" r="5" fill="#8B5CF6"/><circle cx="258.7" cy="217.0" r="5" fill="none" stroke="#8B5CF6" class="ring" style="animation-delay:1.33s;transform-origin:258.7px 217.0px"/><text x="268.7" y="221.0" fill="#8B5CF6" text-anchor="start">AI agents</text></g><g class="b" style="animation-delay:2.00s"><circle cx="160.0" cy="230.0" r="5" fill="#38BDF8"/><circle cx="160.0" cy="230.0" r="5" fill="none" stroke="#38BDF8" class="ring" style="animation-delay:2.00s;transform-origin:160.0px 230.0px"/><text x="170.0" y="234.0" fill="#38BDF8" text-anchor="start">Crypto</text></g><g class="b" style="animation-delay:2.67s"><circle cx="80.3" cy="206.0" r="5" fill="#FACC15"/><circle cx="80.3" cy="206.0" r="5" fill="none" stroke="#FACC15" class="ring" style="animation-delay:2.67s;transform-origin:80.3px 206.0px"/><text x="70.3" y="210.0" fill="#FACC15" text-anchor="end">Desktop apps</text></g><g class="b" style="animation-delay:3.33s"><circle cx="61.3" cy="103.0" r="5" fill="#00F5D4"/><circle cx="61.3" cy="103.0" r="5" fill="none" stroke="#00F5D4" class="ring" style="animation-delay:3.33s;transform-origin:61.3px 103.0px"/><text x="51.3" y="107.0" fill="#00F5D4" text-anchor="end">Automation</text></g>
<circle cx="160" cy="160" r="4" fill="#00F5D4"/>
</svg>